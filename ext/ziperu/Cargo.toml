[package]
name = "ziperu"
version = "0.4.0"
edition = "2021"
publish = false
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = { version = "0.9", default-features = false, features = ["stable-api-compiled-fallback"] }
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "zstd",
    "lzma",
    "xz",
    "ppmd",
    "legacy-zip",
    "aes-crypto",
    "time",
    "unreserved",
    "rayon",
] }
# For `Writer#add_files_parallel`: a pool of the size Ruby asks for.
rayon = "1"

# For ZipCrypto writing (the zip crate keeps its encrypter private): the
# same deflate backend the crate uses, a CRC and some randomness.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
getrandom = { version = "0.4", features = ["std"] }

# For reading compressed tar archives: the codecs the zip crate already
# brings in for its own entries, at the versions and with the backends it
# picks, so nothing more is compiled.
bzip2 = { version = "0.6", default-features = false }
zstd = { version = "0.14", default-features = false }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }

# O_NOFOLLOW for extraction (already in the tree through the zip crate's
# dependencies).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[build-dependencies]
rb-sys-env = "0.2"

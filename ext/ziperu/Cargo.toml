[package]
name = "ziperu"
version = "0.2.2"
edition = "2021"
publish = false
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = { version = "0.9", default-features = false, features = ["stable-api-compiled-fallback"] }
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "zstd",
    "lzma",
    "xz",
    "ppmd",
    "legacy-zip",
    "aes-crypto",
    "time",
    "unreserved",
    "rayon",
] }
# For `Writer#add_files_parallel`: a pool of the size Ruby asks for.
rayon = "1"

# For ZipCrypto writing (the zip crate keeps its encrypter private): the
# same deflate backend the crate uses, a CRC and some randomness.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
getrandom = { version = "0.4", features = ["std"] }

[build-dependencies]
rb-sys-env = "0.2"

# ziperu against rubyzip (bench/bench.rb) on the three CI platforms, on
# demand: run it from the Actions tab, or add the label `bench` to a pull
# request. Each run's table lands in the job summary and as an artifact;
# docs/benchmarks.md is updated from them by hand, so the published
# numbers say which run they came from.

name: Bench

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per scenario (the median is reported)
        default: "5"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - name: Benchmark
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} ($(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") cores)"
            echo
            RUNS="${{ inputs.runs || 5 }}" bundle exec rake bench | grep -v "^preparing"
          } | tee bench-${{ matrix.os }}.md
          cat bench-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.md

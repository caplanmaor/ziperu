# Builds the precompiled native gems (one per platform, each holding the
# extension for every Ruby in the snapshot) plus the source gem, on a
# version tag. Which platforms and Rubies is the committed snapshot in
# .github/release-matrix.json, not whatever upstream lists on the day: a
# release gains or loses one only when that file is changed
# (release-matrix.yml says when it has fallen behind).
# The gems are attached to a GitHub release as a draft; pushing them to
# rubygems.org is a manual `gem push` from there, on purpose.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.read.outputs.platforms }}
      rubies: ${{ steps.read.outputs.rubies }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the release matrix snapshot
        id: read
        run: |
          echo "platforms=$(jq -c '.platforms' .github/release-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "rubies=$(jq -r '.rubies | join(",")' .github/release-matrix.json)" >> "$GITHUB_OUTPUT"

  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v4
        with:
          name: source-gem
          path: pkg/*.gem

  cross-gem:
    name: native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ needs.matrix.outputs.rubies }}
      # RubyGems treats a bare `x86_64-linux` platform as any libc and
      # installs it on Alpine too, where it cannot load; name the libc.
      - name: Name the libc in the glibc gem's platform
        if: ${{ contains(matrix.platform, 'linux') && !contains(matrix.platform, 'musl') }}
        run: ruby .github/scripts/replatform.rb "${{ steps.cross-gem.outputs.gem-path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: pkg/*.gem

  # Every native gem must install and load on its own platform without a
  # Rust toolchain; the smoke test is the whole point of shipping binaries.
  smoke:
    name: install on ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: gems
      - name: Install the gem built for this platform and load it
        run: ruby .github/scripts/smoke.rb gems

  # Alpine, where the musl gem must be the one RubyGems picks.
  smoke-musl:
    name: install on alpine / ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: gems
      # libgcc is what the README asks for on Alpine; the 3.2+ images have it.
      - name: Install the gem built for this platform and load it
        run: |
          docker run --rm -v "$PWD:/work" -w /work ruby:${{ matrix.ruby }}-alpine sh -ec 'apk add --no-cache libgcc >/dev/null && ruby .github/scripts/smoke.rb gems'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-gem, cross-gem, smoke, smoke-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: gems
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: gems/*.gem

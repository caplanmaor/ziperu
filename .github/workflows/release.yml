# Builds the precompiled native gems (one per platform, each holding the
# extension for every stable Ruby) plus the source gem, on a version tag.
# The gems are attached to a GitHub release as a draft; pushing them to
# rubygems.org is a manual `gem push` from there, on purpose.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci-data:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          # 32-bit ARM Linux and the legacy mingw32 toolchain are not worth
          # a build each; the Rust `zip` crate's deps are untested there.
          supported-ruby-platforms: |
            exclude: [arm-linux, x86-linux, x86-mingw32, x64-mingw32]
          stable-ruby-versions: |
            exclude: [head]

  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v4
        with:
          name: source-gem
          path: pkg/*.gem

  cross-gem:
    name: native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          # The stable set starts at the oldest Ruby still maintained; the
          # gemspec promises 3.1 and up, so build the two EOL minors too.
          ruby-versions: ${{ format('3.1,3.2,{0}', join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',')) }}
      # RubyGems treats a bare `x86_64-linux` platform as any libc and
      # installs it on Alpine too, where it cannot load; name the libc.
      - name: Name the libc in the glibc gem's platform
        if: ${{ contains(matrix.platform, 'linux') && !contains(matrix.platform, 'musl') }}
        run: ruby .github/scripts/replatform.rb "${{ steps.cross-gem.outputs.gem-path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: pkg/*.gem

  # Every native gem must install and load on its own platform without a
  # Rust toolchain; the smoke test is the whole point of shipping binaries.
  smoke:
    name: install on ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: gems
      - name: Install the gem built for this platform and load it
        run: ruby .github/scripts/smoke.rb gems

  # Alpine, where the musl gem must be the one RubyGems picks.
  smoke-musl:
    name: install on alpine / ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: gems
      # libgcc is what the README asks for on Alpine; the 3.2+ images have it.
      - name: Install the gem built for this platform and load it
        run: |
          docker run --rm -v "$PWD:/work" -w /work ruby:${{ matrix.ruby }}-alpine sh -ec 'apk add --no-cache libgcc >/dev/null && ruby .github/scripts/smoke.rb gems'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-gem, cross-gem, smoke, smoke-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: gems
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: gems/*.gem

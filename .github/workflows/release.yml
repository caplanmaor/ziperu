# Builds the precompiled native gems (one per platform, each holding the
# extension for every stable Ruby) plus the source gem, on a version tag.
# The gems are attached to a GitHub release as a draft; pushing them to
# rubygems.org is a manual `gem push` from there, on purpose.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci-data:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          # 32-bit ARM Linux and the legacy mingw32 toolchain are not worth
          # a build each; the Rust `zip` crate's deps are untested there.
          supported-ruby-platforms: |
            exclude: [arm-linux, x86-linux, x86-mingw32, x64-mingw32]
          stable-ruby-versions: |
            exclude: [head]

  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v4
        with:
          name: source-gem
          path: pkg/*.gem

  cross-gem:
    name: native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}
      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  # Every native gem must install and load on its own platform without a
  # Rust toolchain; the smoke test is the whole point of shipping binaries.
  smoke:
    name: install on ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.4"]
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: gems
      - name: Install the gem built for this platform
        shell: bash
        run: |
          ruby -e '
            require "rubygems/package"
            gem = Dir["gems/*.gem"].find { |f| Gem::Platform.match_spec?(Gem::Package.new(f).spec) }
            abort "no gem matches #{Gem::Platform.local}" unless gem
            puts "installing #{gem}"
            exec "gem", "install", "--local", "--ignore-dependencies", gem
          '
      - name: Load it without a Rust toolchain
        shell: bash
        run: |
          ruby -e '
            require "zip"
            out = Zip::OutputStream.write_buffer { |z| z.put_next_entry("a.txt"); z.write("ok") }
            Zip::File.open_buffer(out.string) { |zf| abort "round trip failed" unless zf.read("a.txt") == "ok" }
            puts "ziperu #{Ziperu::VERSION} loaded as Zip on #{RUBY_PLATFORM}"
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-gem, cross-gem, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: gems
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: gems/*.gem

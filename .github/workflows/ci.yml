name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test

  # Missing `mark` calls on wrapped objects show up with a GC on every
  # allocation, which is too slow for the whole suite on every platform:
  # the native-boundary tests, once.
  gc-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test:gc_stress
        env:
          GC_STRESS: "true"

  # rubyzip's own suite against this gem; fails when fewer tests pass
  # than the committed COMPAT.md records.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake compat
      - uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            COMPAT.md
            tmp/compat-logs/

  # Differential fuzzing against Python's zipfile and rubyzip, a few
  # minutes' worth per run with a fresh seed; failures are uploaded with
  # the seed to reproduce them.
  fuzz:
    runs-on: ubuntu-latest
    # A hang must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bundle exec rake compile
      - run: bundle exec rake fuzz
        env:
          TIME: "180"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failures
          path: tmp/fuzz/failures/

  # Archives exchanged with Info-ZIP, 7-Zip and Python's zipfile.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip p7zip-full python3
      - run: bundle exec rake compile
      - run: bundle exec ruby -Ilib test/interop/run.rb

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          rustup-components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

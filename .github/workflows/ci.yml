name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly: the whole suite under GC stress, below

# A newer push supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Ruby promised (best effort), and the supported ones'
        # ends; see the README's table.
        ruby: ["3.1", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test

  # The next Ruby, before it is released: a failure here is a warning to
  # act on, not a red build. Nightly and on demand only.
  ruby-head:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: head
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test

  # Missing `mark` calls on wrapped objects show up with a GC on every
  # allocation, which is too slow for the whole suite on every platform:
  # the native-boundary tests, once.
  gc-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake ${{ github.event_name == 'schedule' && 'test' || 'test:gc_stress' }}
        env:
          GC_STRESS: "true"

  # rubyzip's own suite against this gem; fails when fewer tests pass
  # than the committed COMPAT.md records.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake compat
      - uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            COMPAT.md
            tmp/compat-logs/

  # Differential fuzzing against Python's zipfile and rubyzip, a few
  # minutes' worth per run with a fresh seed; failures are uploaded with
  # the seed to reproduce them.
  fuzz:
    runs-on: ubuntu-latest
    # A hang must not hold a runner for the six hours GitHub allows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bundle exec rake compile
      - run: bundle exec rake fuzz
        env:
          TIME: "180"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failures
          path: tmp/fuzz/failures/

  # Archives exchanged with Info-ZIP, 7-Zip and Python's zipfile.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip p7zip-full python3
      - run: bundle exec rake compile
      - run: bundle exec ruby -Ilib test/interop/run.rb

  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_WITH: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          rustup-components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        working-directory: ext/ziperu

  # The native core under valgrind (ruby_memcheck), and a loop of the
  # whole API with the resident size sampled, for leaks neither the test
  # suite nor GC stress can see.
  memcheck:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: memcheck
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bundle exec rake compile
      - run: bundle exec rake mem:check
      - run: bundle exec rake mem:growth
        env:
          ITERATIONS: "600"
